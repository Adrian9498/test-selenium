name: Python Test Suite with Chrome

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install Chrome
      uses: browser-actions/setup-chrome@v1
      with:
        chrome-version: 'latest'  # o versión específica como '120.0.6099.109'

    - name: Install ChromeDriver
      run: |
        # Obtener versión mayor de Chrome instalado
        CHROME_MAJOR_VERSION=$(google-chrome --version | awk '{print $3}' | cut -d '.' -f 1)
        # Descargar ChromeDriver compatible
        wget -q https://chromedriver.storage.googleapis.com/LATEST_RELEASE_${CHROME_MAJOR_VERSION} -O chromedriver-version.txt
        CHROMEDRIVER_VERSION=$(cat chromedriver-version.txt)
        wget -q https://chromedriver.storage.googleapis.com/${CHROMEDRIVER_VERSION}/chromedriver_linux64.zip
        unzip chromedriver_linux64.zip -d $HOME/chromedriver
        rm chromedriver_linux64.zip chromedriver-version.txt
        echo "$HOME/chromedriver" >> $GITHUB_PATH

    - name: Verify installations
      run: |
        google-chrome --version
        chromedriver --version

    - name: Install Python packages
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-html selenium

    - name: Run tests
      run: |
        mkdir -p reports
        pytest test.py --html=reports/report.html --self-contained-html

    - name: Upload test report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pytest-report
        path: reports/report.html
