name: Python Test Suite with Chrome

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install Chrome and ChromeDriver
      uses: browser-actions/setup-chrome-with-driver@v1
      with:
        chrome-version: 'latest'  # o versión específica como '119.0.6045.105'
        driver-version: 'latest'  # versión compatible automáticamente

    - name: Verify Chrome installation
      run: |
        google-chrome --version
        chromedriver --version

    - name: Install Python packages
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-html selenium

    - name: Run tests
      run: |
        mkdir -p reports
        pytest test.py --html=reports/report.html --self-contained-html

    - name: Upload test report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pytest-report
        path: reports/report.html
