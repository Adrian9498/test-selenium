name: Python Test Suite with Selenium Grid

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      selenium:
        image: selenium/standalone-chrome
        ports:
          - 4444:4444
        options: >-
          --shm-size="2g"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-html selenium

    - name: Wait for Selenium Grid
      run: |
        for i in {1..10}; do
          if curl -sSL "http://localhost:4444/wd/hub/status" 2>&1 | grep '"ready": true' >/dev/null; then
            echo "Selenium Grid is ready"
            exit 0
          fi
          echo "Waiting for Selenium Grid to start..."
          sleep 3
        done
        echo "Selenium Grid failed to start"
        exit 1

    - name: Run tests
      run: |
        mkdir -p reports
        pytest test.py --html=reports/report.html --self-contained-html

    - name: Upload test report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pytest-report
        path: reports/report.html
