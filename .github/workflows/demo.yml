name: selenium_tutorial
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install pytest-html
          pip install selenium

      - uses: actions/checkout@v4
        if: success() || failure()
      - run: |
          mkdir -p reports
          pytest test.py --html=reports/reports.html
          chmod 777  /home/runner/work/test-selenium/test-selenium/reports/

      - name: Set output
        if: success() || failure()
        id: results
        run: echo "artifactPath=reports/" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v3
        if: success() || failure()
        with:
          name: test-report
          path: ${{ steps.results.outputs.artifactPath }}